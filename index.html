<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ficha Técnica - fcapex7.com</title>
  <script>
    const WEB_APP_URL = "PEGA_AQUI_LA_URL_DE_TU_WEB_APP_DE_C4";
    const params = new URLSearchParams(window.location.search);
    const idMotor = params.get('id');

    // Si alguien escanea el QR con ?id=MOTOR-01, redirige directo a tu Web App
    if (idMotor) {
      window.location.replace(`${WEB_APP_URL}?id=${encodeURIComponent(idMotor)}`);
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f8fafc; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgb(0 0 0 / 0.1); text-align: center; }
  </style>
</head>
<body>
  <div class="card" id="contenedor">
    <div id="qrcode"></div>
    <p id="texto" style="color:#64748b; font-size:0.9rem;"></p>
  </div>
  <script>
    const data = params.get('data');
    if (data && !idMotor) {
      document.getElementById('texto').innerText = data;
      new QRCode(document.getElementById("qrcode"), { text: data, width: 250, height: 250 });
    }
  </script>
</body>
</html>
